# Copy to ~/.cloudflared/config.yml AFTER creating an actual tunnel.
# Do not commit credentials JSON or cert.pem.
tunnel: REPLACE_TUNNEL_UUID
credentials-file: /Users/YOUR_USER/.cloudflared/REPLACE_TUNNEL_UUID.json
ingress:
  - hostname: store.example.com
    service: http://127.0.0.1:8000
  - service: http_status:404
